<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PROJECT-NULL // NODE 07</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #050505;
            color: #d8d8d8;
            font-family: "Courier New", monospace;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .terminal {
            width: 92%;
            max-width: 850px;
            padding: 42px;

            background: #080808;
            border: 1px solid #292929;

            box-shadow: 0 0 45px rgba(255,255,255,0.025);
        }

        .system {
            color: #555;
            font-size: 12px;
            margin-bottom: 30px;
        }

        h1 {
            margin: 0 0 35px;

            color: #eee;
            font-size: 28px;
            letter-spacing: 6px;
        }

        .text {
            color: #888;
            line-height: 1.9;
        }

        .doors {
            margin: 35px 0;
            padding: 25px;

            border: 1px solid #202020;
        }

        .door {
            display: block;

            padding: 14px;
            margin: 10px 0;

            border: 1px solid #222;

            color: #555;
            text-decoration: none;

            transition: 0.2s;
        }

        .door:hover {
            color: #aaa;
            border-color: #444;
        }

        .dead {
            color: #333;
        }

        input {
            width: 100%;
            margin-top: 30px;

            padding: 14px;

            background: #050505;
            border: 1px solid #333;

            color: #eee;
            font-family: inherit;
            font-size: 15px;

            outline: none;
        }

        input:focus {
            border-color: #777;
        }

        button {
            width: 100%;
            margin-top: 12px;

            padding: 14px;

            background: #101010;
            border: 1px solid #444;

            color: #ccc;
            font-family: inherit;

            cursor: pointer;
        }

        button:hover {
            background: #171717;
        }

        #result {
            min-height: 65px;
            margin-top: 25px;

            color: #777;
            line-height: 1.7;
        }

        .fragment {
            color: #ddd;
        }
    </style>
</head>

<body>

<div class="terminal">

    <div class="system">
        PROJECT-NULL // NODE 07
    </div>

    <h1>DEAD END</h1>

    <div class="text">

        Every path leads somewhere.

        <br><br>

        Unless it doesn't.

        <br><br>

        Choose a door.

    </div>


    <div class="doors">

        <a class="door" href="dead-end-01.html">
            / 01
        </a>

        <a class="door" href="dead-end-02.html">
            / 02
        </a>

        <a class="door" href="dead-end-03.html">
            / 03
        </a>

        <a class="door" href="dead-end-04.html">
            / 04
        </a>

    </div>


    <div class="text">

        None of them open.

        <br><br>

        Perhaps that is the answer.

    </div>


    <input
        id="answer"
        type="text"
        autocomplete="off"
        spellcheck="false"
    >

    <button onclick="verify()">VERIFY</button>

    <div id="result"></div>

</div>


<!--

    A dead end is still a destination.

    --------------------------------

    01 -> 404
    02 -> 404
    03 -> 404
    04 -> 404

    --------------------------------

    They are all dead.

    But they are not identical.

    --------------------------------

    Count what remains after the destination disappears.

    --------------------------------

    404

    --------------------------------

    Do not enter the number.

    The number is a position.

-->


<div hidden>

    <span data-path="dead-end-01.html">
        nothing
    </span>

    <span data-path="dead-end-02.html">
        nothing
    </span>

    <span data-path="dead-end-03.html">
        nothing
    </span>

    <span data-path="dead-end-04.html">
        nothing
    </span>

</div>


<script>

function verify() {

    const input =
        document
        .getElementById("answer")
        .value
        .trim()
        .toUpperCase();

    const result =
        document
        .getElementById("result");


    /*
        FALSE TRAIL
    */

    if (input === "DEAD END") {

        result.innerHTML =
            "> YOU FOUND THE DEAD END.<br>" +
            "> THAT WAS THE ENTIRE POINT.";

        return;
    }


    /*
        FALSE TRAIL
    */

    if (input === "404") {

        result.innerHTML =
            "> ERROR CODE CONFIRMED.<br>" +
            "> YOU WERE TOLD NOT TO ENTER IT.";

        return;
    }


    /*
        FIRST DISCOVERY
    */

    if (input === "NOTHING") {

        result.innerHTML =
            "> NOTHING IS WHAT REMAINS.<br>" +
            "> BUT NOTHING HAS A POSITION.";

        return;
    }


    /*
        SECOND LAYER
    */

    if (input === "POSITION") {

        result.innerHTML =
            "> POSITION CONFIRMED.<br>" +
            "> YOU STILL HAVE A NUMBER.";

        return;
    }


    /*
        THIRD LAYER
    */

    if (input === "404TH") {

        result.innerHTML =
            "> THERE IS NO 404TH ELEMENT.<br>" +
            "> LOOK AT THE NUMBER DIFFERENTLY.";

        return;
    }


    /*
        FINAL FRAGMENT
    */

    if (input === "E") {

        result.innerHTML =
            "> ACCESS GRANTED.<br>" +
            "> NODE 07 COMPLETE.<br><br>" +
            '<span class="fragment">FRAGMENT: E</span>';

        setTimeout(() => {
            window.location.href = "../08/index.html";
        }, 2500);

        return;
    }


    result.innerHTML =
        "> ACCESS DENIED.";
}

</script>

</body>
</html>
