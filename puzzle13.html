<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PROJECT-NULL — 13</title>

    <style>
        body {
            margin: 0;
            background: #000;
            color: #ccc;
            font-family: monospace;
            text-align: center;
        }

        .container {
            max-width: 700px;
            margin: 100px auto;
            padding: 20px;
        }

        h1 {
            letter-spacing: 8px;
        }

        .text {
            margin: 50px auto;
            line-height: 2.2;
            font-size: 20px;
        }

        .hint {
            color: #555;
            margin-bottom: 40px;
        }

        input {
            background: #080808;
            border: 1px solid #555;
            color: #fff;
            padding: 12px;
            width: 250px;
            font-family: monospace;
            outline: none;
        }

        button {
            background: #080808;
            color: #aaa;
            border: 1px solid #555;
            padding: 12px 20px;
            font-family: monospace;
            cursor: pointer;
        }

        button:hover {
            border-color: #aaa;
        }

        #result {
            margin-top: 30px;
        }
    </style>
</head>

<body>

<!--
    Some words speak.
    Some words are silent.
    Listen only to the ones that shout.

    You are reading the wrong direction.
-->

<div class="container">

    <h1>PROJECT-NULL</h1>

    <p>PUZZLE 13</p>

    <div class="text">
        nothing<br>
        EVERYTHING<br>
        is<br>
        NEVER<br>
        visible<br>
        SOMETHING<br>
        when<br>
        YOU<br>
        look<br>
        closely.
    </div>

    <div class="hint">
        THE ANSWER IS ALREADY HERE.
    </div>

    <input
        type="text"
        id="answer"
        placeholder="ENTER ANSWER"
        autocomplete="off"
    >

    <button onclick="checkAnswer()">SUBMIT</button>

    <div id="result"></div>

</div>

<script>

function checkAnswer() {

    const answer = document
        .getElementById("answer")
        .value
        .trim()
        .toUpperCase();

    if (answer === "BHMV") {

        document.getElementById("result").textContent =
            "ACCESS GRANTED";

        setTimeout(() => {
            window.location.href = "puzzle14.html";
        }, 1000);

    } else {

        document.getElementById("result").textContent =
            "ACCESS DENIED";
    }
}

</script>

</body>
</html>
